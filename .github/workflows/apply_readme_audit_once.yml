name: Preserve exact historical README
on:
  push:
    branches: [ main ]
    paths: [ .github/workflows/apply_readme_audit_once.yml ]
permissions:
  contents: write
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preserve exact historical blob
        run: |
          set -euo pipefail
          git show 6a1def0332ce37625e455bba8cad278abbbcc404:README.md > README_HISTORY_2026-09-09.md
          test "$(git hash-object README_HISTORY_2026-09-09.md)" = 0165054c59ac4a87a3beaacc333313916fe9956c
          if git diff --quiet -- README_HISTORY_2026-09-09.md; then exit 0; fi
          git config user.name vcruz305
          git config user.email vcruz305@users.noreply.github.com
          git add README_HISTORY_2026-09-09.md
          git commit -m "docs: archive original README byte-for-byte"
          git push origin HEAD:main
