name: Canonicalize AGPL transition

on:
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  canonicalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install canonical license and update stale wording
        run: |
          set -euo pipefail
          SOURCE_REF=28041c423a81fe033e7128d8888e3762fb914910
          EXPECTED_BLOB=a481841805b117ee07dda76ba0af9b032f5c98f8
          curl -fsSL "https://raw.githubusercontent.com/vcruz305/vllm-exl3/${SOURCE_REF}/LICENSE" -o /tmp/AGPL-3.0
          ACTUAL_BLOB="$(git hash-object /tmp/AGPL-3.0)"
          test "$ACTUAL_BLOB" = "$EXPECTED_BLOB" || {
            echo "canonical license hash mismatch: $ACTUAL_BLOB" >&2
            exit 1
          }
          cp /tmp/AGPL-3.0 LICENSE

          python - <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = "> Both projects are MIT licensed. Their notices are in [THIRD_PARTY_NOTICES.md](THIRD_PARTY_NOTICES.md)\n> and must be kept with the code. Earlier releases here shipped without those notices, which was our\n> mistake. Thank you to both projects for the work this is built on."
          new = "> The historical upstream code reused here is MIT-licensed. Current recipe work is distributed under **AGPL-3.0-only**; the recipe's prior MIT license is preserved in [LICENSE.MIT](LICENSE.MIT). Full third-party notices remain in [THIRD_PARTY_NOTICES.md](THIRD_PARTY_NOTICES.md) and must stay with the covered code. Thank you to the upstream projects this work builds on."
          if old in text:
              text = text.replace(old, new, 1)
          elif "Current recipe work is distributed under **AGPL-3.0-only**" not in text:
              raise SystemExit("README attribution/license paragraph drifted; refusing broad edit")
          readme.write_text(text, encoding="utf-8")

          notices = Path("THIRD_PARTY_NOTICES.md")
          text = notices.read_text(encoding="utf-8")
          old = "This project contains and derives from MIT-licensed work by other authors, whose copyright and permission notices are reproduced below as those licences require."
          new = "Current recipe work is distributed under **AGPL-3.0-only**. The repository previously used MIT; that historical project license is preserved in `LICENSE.MIT`. This project also contains and derives from MIT-licensed third-party work whose original copyright and permission notices are reproduced below and remain in force for the material they cover."
          if old in text:
              text = text.replace(old, new, 1)
          elif "Current recipe work is distributed under **AGPL-3.0-only**" not in text:
              raise SystemExit("THIRD_PARTY_NOTICES intro drifted; refusing broad edit")
          notices.write_text(text, encoding="utf-8")
          PY

      - name: Commit only when needed
        run: |
          set -euo pipefail
          if git diff --quiet -- LICENSE README.md THIRD_PARTY_NOTICES.md; then
            echo "Already canonical; no commit needed."
            exit 0
          fi
          git config user.name "vcruz305"
          git config user.email "vcruz305@users.noreply.github.com"
          git add LICENSE README.md THIRD_PARTY_NOTICES.md
          git commit -m "license: canonicalize AGPL transition and provenance wording"
          git push origin HEAD:main
